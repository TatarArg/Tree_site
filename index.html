<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <title> Трансформация и анимация</title>
    <link rel="stylesheet" href="CSS/style.css">
    <script src="http://d3js.org/d3.v7.min.js"> </script>
    <script src="JavaScript/main.js"></script>
    <script src="JavaScript/image.js"></script>
    <script src="JavaScript/path.js"></script>
</head>

<body>
    <form id="setting">
        <div class="form_1">
            <div id="pathOptions" style="display:none;">
                <p>Путь перемещения: <br>
                    <select id="pathType">
                        <option value="0">Буквой "Г"</option>
                        <option value="1">По кругу</option>
                        <option value="2">Буквой "W"</option>
                    </select>
                </p>
            </div>
            <p id="coordinatesBlock">Координаты рисунка<br>
                <label for="cx">x: </label>
                <input type="number" id="cx" value="300" max="600" min="0">
                <label for="cx_1">до </label>
                <input type="number" id="cx_1" value="300" max="600" min="0">
                <br>
                <label for="cy">y: </label>
                <input type="number" id="cy" value="300" max="600" min="0">
                <label for="cy_1">до </label>
                <input type="number" id="cy_1" value="300" max="600" min="0">
            </p>
            <p id="scaleBlock">Масштаб<br>
                <label for="scaleX">по x: </label>
                <input type="number" id="scaleX" value="1" min="0">
                <label for="scaleX_1">до </label>
                <input type="number" id="scaleX_1" value="1" min="0">
                <br>
                <label for="scaleY">по y: </label>
                <input type="number" id="scaleY" value="1" min="0">
                <label for="scaleY_1">до </label>
                <input type="number" id="scaleY_1" value="1" min="0">
            </p>
            <p id="rotateBlock">Поворот<br>
                <label for="rotate">угол: </label>
                <input type="number" id="rotate" value="0">
                <label for="rotate_1">до </label>
                <input type="number" id="rotate_1" value="0">
            </p>
            <p id="timeBlock">Время анимации<br>
                <label for="t">t: </label>
                <input type="number" id="t" value="6000">
            </p>
        </div>
        <p>
            <input type="button" value="Нарисовать" id="drawB" onclick="draw(document.getElementById('setting'))">
            <input type="button" value="Очистить" onclick="clearDraw(document.getElementById('setting'))">
            <input type="button" value="Анимировать" onclick="runAnimation(document.getElementById('setting'))">
        </p>

        <p>
            <label for="animateCheckbox">Включить анимацию?</label>
            <input type="checkbox" id="animateCheckbox">
            <br>
            <label for="pathMovement">Перемещение вдоль пути?</label>
            <input type="checkbox" id="pathMovement">
        </p>



        <div id="animationControls">
            <p>
                <label for="animationType">Тип анимации:</label>
                <select id="animationType">
                    <option value="linear">linear</option>
                    <option value="elastic">elastic</option>
                    <option value="bounce">bounce</option>
                </select>
            </p>
        </div>
    </form>

    <svg></svg>

</body>

</html>
